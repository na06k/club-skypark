<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reservations - CLUB SKYPARK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

.header{
    background:#111;
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    margin:0;
    color:#C9A96E;
}

.container{
    padding:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

th{
    background:#C9A96E;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#fafafa;
}

.status{
    background:orange;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
}

</style>

</head>
<body>

<div class="header">
    <h1>CLUB SKYPARK BOOKINGS</h1>
</div>

<div class="container">

<table>

<thead>
<tr>
<th>ID</th>
<th>Guest</th>
<th>Email</th>
<th>Phone</th>
<th>Room</th>
<th>Check In</th>
<th>Check Out</th>
<th>Total</th>
<th>Status</th>
</tr>
</thead>

<tbody id="bookingTable">

</tbody>

</table>

</div>

<script>

const supabaseUrl = 'https://fxymcysmgdthtkyzvhbx.supabase.co';

const supabaseKey = 'YOUR_ANON_KEY';

const client = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function loadBookings(){

    const { data, error } = await client
        .from('bookings')
        .select('*')
        .order('id', { ascending:false });

    if(error){
        console.log(error);
        alert('Failed to load bookings');
        return;
    }

    const table = document.getElementById('bookingTable');

    table.innerHTML = '';

    data.forEach(booking => {

        table.innerHTML += `
        <tr>
            <td>${booking.id}</td>
            <td>${booking.guest_name}</td>
            <td>${booking.guest_email}</td>
            <td>${booking.guest_phone}</td>
            <td>${booking.room_name}</td>
            <td>${booking.check_in}</td>
            <td>${booking.check_out}</td>
            <td>₹${booking.total_price}</td>
            <td>
                <span class="status">
                    ${booking.booking_status}
                </span>
            </td>
        </tr>
        `;

    });

}

loadBookings();

</script>

</body>
</html>
